<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Приложение подростка 14–17</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#16171C}
a{color:#5B8CFF}a:hover{color:#8EB0FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #16171C; font-family: Inter, -apple-system, sans-serif; color: #FFFFFF; position: relative; overflow: hidden">
  <div style="background: linear-gradient(170deg, #2B63F5 0%, #0B2C9C 100%); border-radius: 0 0 30px 30px; padding: 52px 20px 20px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800">М</div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 18px; font-weight: 700">Марк</div>
        <div style="font-size: 12px; color: #DCE5FF; margin-top: 1px">Moby Teen · •• 5521</div>
      </div>
      <span style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: rgba(22,23,28,.45); font-size: 14px; font-weight: 700; color: #3ECF6E; white-space: nowrap">Кешбэк {{cb}}%</span>
    </div>
    <div style="font-size: 34px; font-weight: 700; margin-top: 16px; letter-spacing: -0.5px">{{balText}}</div>
    <div style="font-size: 13px; color: #DCE5FF; margin-top: 2px">Сегодня можно ещё 38,20 из 50 BYN</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px">
      <button type="button" onClick="{{actAsk}}" style="border: 0; cursor: pointer; background: rgba(22,23,28,.55); border-radius: 16px; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #FFFFFF; font: 13px Inter, sans-serif">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9FBBFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 11c0 5.6-7 10-7 10z"/></svg>Попросить</button>
      <button type="button" onClick="{{actTransfer}}" style="border: 0; cursor: pointer; background: rgba(22,23,28,.55); border-radius: 16px; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #FFFFFF; font: 13px Inter, sans-serif">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9FBBFF" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 10h8l-3-3M16 14H8l3 3"/></svg>Перевести</button>
      <button type="button" onClick="{{actPay}}" style="border: 0; cursor: pointer; background: rgba(22,23,28,.55); border-radius: 16px; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #FFFFFF; font: 13px Inter, sans-serif">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9FBBFF" stroke-width="1.8" aria-hidden="true"><path d="M4 7h14a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><path d="M4 7l11-3v3M16 13h1"/></svg>Оплатить</button>
    </div>
  </div>

  <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <a href="Game.dc.html#teen" aria-label="Открыть игру Moby" style="display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 22px; background: linear-gradient(110deg, #1d3f99 0%, #2a1640 60%, #5a1260 100%); color: #FFFFFF; text-decoration: none">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #FFD23F">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V8l6-3v16M11 21V10l8 3v8M8 10v.01M8 13v.01M8 16v.01M15 15v.01M15 18v.01"/></svg>
      </div>
      <div style="flex: 1; min-width: 0"><div style="font-size: 17px; font-weight: 800; letter-spacing: 0.5px">MOBY</div><div style="font-size: 13px; color: #DCD3F5; margin-top: 2px">Квесты и уроки про деньги</div></div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </a>

    <div style="background: #24262F; border-radius: 18px; padding: 14px 16px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div>
          <div style="font-size: 12px; color: #9A9CA8">Уровень карты</div>
          <div style="font-size: 17px; font-weight: 700; margin-top: 2px">{{tier}}</div>
        </div>
        <div style="text-align: right">
          <div style="font-size: 12px; color: #9A9CA8">Следующий</div>
          <div style="font-size: 17px; font-weight: 700; margin-top: 2px; color: #3ECF6E">{{nextTier}}</div>
        </div>
      </div>
      <div style="height: 8px; border-radius: 4px; background: #2E3039; margin-top: 12px; overflow: hidden"><div style="{{bar}}"></div></div>
      <div style="font-size: 13px; color: #C8CAD3; margin-top: 8px">{{tierHint}}</div>
    </div>

    <div style="background: #24262F; border-radius: 18px; padding: 2px 0">
      <button type="button" onClick="{{menuTasks}}" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; border: 0; border-bottom: 1px solid #2E3039; background: transparent; color: #FFFFFF; cursor: pointer; font-family: inherit; text-align: left">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: #1E2A4A; color: #7FA2FF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>
        </div>
        <div style="flex: 1; min-width: 0"><div style="font-size: 15px; font-weight: 600">Задания от мамы</div><div style="font-size: 12px; color: #4CD47A; margin-top: 2px">1 новое · +5,00 BYN</div></div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6C6F7C" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <a href="Kopilka.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; border-bottom: 1px solid #2E3039; color: #FFFFFF; text-decoration: none">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #3ECF6E, #1D6B3A); flex-shrink: 0"></div>
        <div style="flex: 1; min-width: 0"><div style="font-size: 15px; font-weight: 600">Копилка</div><div style="font-size: 12px; color: #9A9CA8; margin-top: 2px">86,00 BYN · 8% годовых</div></div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6C6F7C" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </a>
      <a href="Deposits.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; color: #FFFFFF; text-decoration: none">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #FF9A3D, #E0218A); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800">%</div>
        <div style="flex: 1; min-width: 0"><div style="font-size: 15px; font-weight: 600">Вклады в BYN</div><div style="font-size: 12px; color: #9A9CA8; margin-top: 2px">С 14 лет открываешь сам · от 3%</div></div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6C6F7C" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </a>
    </div>
  </div><nav style="height: 83px; background: #1E1F25; border-radius: 30px 30px 0 0; border-top: 1px solid #34363F; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 10px 8px 18px; box-sizing: border-box; width: 384px">
    <a href="TeenHome.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #7FA2FF; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>Главная</a>
    <button type="button" onClick="{{menuProducts}}" style="border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #FFFFFF; font: 12px Inter, sans-serif">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="7" width="18" height="12" rx="2"/><path d="M5 4h15a2 2 0 012 2v9"/></svg>Продукты</button>
    <a href="Game.dc.html#teen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #FFFFFF; font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFD23F" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V8l6-3v16M11 21V10l8 3v8"/></svg>Moby</a>
    <button type="button" onClick="{{openChat}}" style="border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #FFFFFF; font: 12px Inter, sans-serif">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 5h12v8H8l-3 3v-3H3zM15 9h6v8h-2v3l-3-3h-5v-4"/></svg>Чат</button>
    <button type="button" onClick="{{menuMore}}" style="border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #FFFFFF; font: 12px Inter, sans-serif">
      <svg width="24" height="24" viewBox="0 0 26 22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="5" cy="11" r="2.4"/><circle cx="13" cy="11" r="2.4"/><circle cx="21" cy="11" r="2.4"/></svg>Ещё</button>
  </nav>

  <sc-if value="{{ov.action}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 40"><dc-import name="Action" kind="{{ov.kind}}" who="teen" on-close="{{closeOv}}" on-done="{{onDone}}" hint-size="390px,844px"></dc-import></div>
  </sc-if>
  <sc-if value="{{ov.menu}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 40"><dc-import name="Menu" mode="{{ov.kind}}" who="teen" on-close="{{closeOv}}" hint-size="390px,844px"></dc-import></div>
  </sc-if>
  <sc-if value="{{ov.chat}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 40"><dc-import name="Chat" who="teen" on-close="{{closeOv}}" hint-size="390px,844px"></dc-import></div>
  </sc-if>
  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 16px; right: 16px; top: 50px; z-index: 50; background: #2E3039; border-radius: 14px; padding: 12px 16px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.45)">{{toast}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { ov: null, toast: '', bal: 25, spent: 31.2 }; }
  componentWillUnmount() { clearTimeout(this.tt); }
  renderVals() {
    const s = this.state;
    const o = s.ov || {};
    const open = (type, kind) => () => this.setState({ ov: { type, kind } });
    const money = (v) => v.toFixed(2).replace('.', ',');
    // Уровни карты Moby Teen — из репозитория mt-city (CARD_TIERS): Старт 0%, Бронза 1% от 50 BYN, Серебро 2% от 100, Золото 3% от 200
    const TIERS = [{ n: 'Старт', min: 0, cb: 0 }, { n: 'Бронза', min: 50, cb: 1 }, { n: 'Серебро', min: 100, cb: 2 }, { n: 'Золото', min: 200, cb: 3 }];
    const i = TIERS.reduce((acc, t, k) => (s.spent >= t.min ? k : acc), 0);
    const cur = TIERS[i], next = TIERS[i + 1];
    const pct = next ? Math.round(((s.spent - cur.min) / (next.min - cur.min)) * 100) : 100;
    return {
      ov: { action: o.type === 'action', menu: o.type === 'menu', chat: o.type === 'chat', kind: o.kind || '' },
      closeOv: () => this.setState({ ov: null }),
      // Оплата картой увеличивает траты месяца — уровень карты и кешбэк пересчитываются
      onDone: (delta, msg) => {
        const paid = o.kind === 'pay' && delta < 0 ? -delta : 0;
        this.setState({ bal: Math.round((this.state.bal + delta) * 100) / 100, spent: this.state.spent + paid, toast: msg });
        clearTimeout(this.tt);
        this.tt = setTimeout(() => this.setState({ toast: '' }), 2600);
      },
      hasToast: !!s.toast,
      toast: s.toast,
      balText: s.bal.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' BYN',
      cb: cur.cb,
      tier: cur.n,
      nextTier: next ? next.n + ' · ' + next.cb + '%' : 'Максимум',
      bar: 'height: 100%; border-radius: 4px; background: #3ECF6E; width: ' + pct + '%',
      tierHint: next ? 'Потрать картой ещё ' + money(next.min - s.spent) + ' BYN за месяц' : 'У тебя максимальный кешбэк 3%',
      actAsk: open('action', 'ask'),
      actTransfer: open('action', 'transfer'),
      actPay: open('action', 'pay'),
      menuTasks: open('menu', 'tasks'),
      menuProducts: open('menu', 'products'),
      menuMore: open('menu', 'more'),
      openChat: open('chat', '')
    };
  }
}
</script>
</body>
</html>

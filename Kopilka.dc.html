<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Копилка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#16171C}
a{color:#5B8CFF}a:hover{color:#8EB0FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #16171C; font-family: Inter, -apple-system, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: linear-gradient(170deg, #2B63F5 0%, #0B2C9C 100%); border-radius: 0 0 30px 30px; padding: 48px 20px 20px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="KidHome.dc.html" aria-label="Назад" style="width: 44px; height: 44px; display: flex; align-items: center; color: #FFFFFF; margin-left: -8px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <span style="flex: 1; font-size: 18px; font-weight: 700">Копилка</span>
      <div style="display: flex; gap: 2px; background: rgba(22,23,28,.4); border-radius: 10px; padding: 3px">
        <sc-for list="{{ages}}" as="a" hint-placeholder-count="2">
          <button type="button" onClick="{{a.pick}}" aria-pressed="{{a.on}}" style="{{a.s}}">{{a.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 18px; margin-top: 10px">
      <div style="position: relative; width: 132px; height: 132px; flex-shrink: 0">
        <svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true">
          <circle cx="66" cy="66" r="56" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="12"/>
          <circle cx="66" cy="66" r="56" fill="none" stroke="#FFD23F" stroke-width="12" stroke-linecap="round" stroke-dasharray="{{dash}}" transform="rotate(-90 66 66)"/>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <span style="font-size: 26px; font-weight: 800">{{pct}}%</span>
          <span style="font-size: 11px; color: #DCE5FF">цели</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <span style="font-size: 13px; color: #DCE5FF">Цель · Велосипед</span>
        <div style="display: flex; align-items: center; gap: 6px">
          <span style="font-size: 28px; font-weight: 800">{{balance}}</span>
          <button type="button" onClick="{{toggleHide}}" aria-label="Скрыть или показать баланс" style="width: 36px; height: 36px; border: 0; background: transparent; color: #DCE5FF; cursor: pointer; display: flex; align-items: center; justify-content: center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <span style="font-size: 13px; color: #DCE5FF">из 450 BYN · {{leftText}}</span>
        <span style="align-self: flex-start; margin-top: 4px; font-size: 12px; font-weight: 600; background: rgba(255,255,255,.16); padding: 4px 10px; border-radius: 10px">8% годовых</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px">
      <sc-for list="{{actions}}" as="b" hint-placeholder-count="3">
        <button type="button" onClick="{{b.go}}" style="height: 64px; border-radius: 16px; border: 0; background: rgba(22,23,28,.55); color: #FFFFFF; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 500 13px Inter, sans-serif">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9FBBFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"/></svg>{{b.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <sc-if value="{{hasNote}}" hint-placeholder-val="{{ false }}">
      <div style="background: #1E2A4A; border-radius: 14px; padding: 10px 14px; font-size: 13px; color: #C9D6FF">{{note}}</div>
    </sc-if>

    <h2 style="margin: 0; font-size: 18px; font-weight: 700">Операции</h2>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{ops}}" as="o" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid #24262F">
          <div style="width: 40px; height: 40px; border-radius: 12px; background: #24262F; display: flex; align-items: center; justify-content: center; color: #7FA2FF; flex-shrink: 0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="{{o.arrow}}"/></svg>
          </div>
          <div style="flex: 1; min-width: 0"><div style="font-size: 15px; font-weight: 500">{{o.title}}</div><div style="font-size: 12px; color: #9A9CA8; margin-top: 2px">{{o.time}}</div></div>
          <div style="{{o.sumStyle}}">{{o.sum}}</div>
        </div>
      </sc-for>
    </div>

    <div style="background: #24262F; border-radius: 18px; padding: 2px 16px">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid #2E3039">
        <div style="flex: 1"><div style="font-size: 15px; font-weight: 500">Автопополнение</div><div style="font-size: 12px; color: #9A9CA8; margin-top: 2px">10% от карманных денег</div></div>
        <button type="button" role="switch" aria-checked="{{auto}}" aria-label="Автопополнение" onClick="{{toggleAuto}}" style="{{autoTrack}}"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; display: block"></span></button>
      </div>
      <a href="{{settingHref}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; color: #FFFFFF; text-decoration: none">
        <div style="flex: 1"><div style="font-size: 15px; font-weight: 500">{{settingLabel}}</div><div style="font-size: 12px; color: #9A9CA8; margin-top: 2px">{{settingSub}}</div></div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6C6F7C" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"age":{"editor":"enum","options":["kid","teen"],"default":"kid"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { age: null, saved: 86, hide: false, auto: true, note: '', ops: [{ title: 'Пополнение с карты', time: 'вчера, 18:40', amt: 5 }, { title: 'Награда за задание', time: 'пн, 19:05', amt: 3 }] };
  }
  renderVals() {
    const age = this.state.age ?? this.props.age ?? 'kid';
    const teen = age === 'teen';
    const s = this.state;
    const target = 450;
    const pct = Math.min(100, Math.round((s.saved / target) * 100));
    const C = 2 * Math.PI * 56;
    const add = (title, amt, note) => this.setState({ saved: Math.max(0, s.saved + amt), note, ops: [{ title, time: 'сейчас', amt }, ...s.ops].slice(0, 2) });
    // Правила по возрасту из репозитория mt-city: до 14 лет снятие и переводы — через родителя, с 14 лет — сам, плюс вклады
    return {
      pct,
      dash: (C * pct) / 100 + ' ' + C,
      balance: s.hide ? '•••• BYN' : s.saved + ' BYN',
      leftText: s.saved >= target ? 'собрано!' : 'ещё ' + (target - s.saved),
      toggleHide: () => this.setState({ hide: !s.hide }),
      actions: [
        { label: 'Пополнить', icon: 'M12 5v14M5 12h14', go: () => add('Пополнение с карты', 5, teen ? '+5 BYN в копилке' : '+5 BYN в копилке · +10 MTcoin в игре') },
        { label: teen ? 'Снять' : 'Попросить', icon: 'M12 4v12M7 11l5 5 5-5M5 20h14', go: () => (teen ? add('Снятие на карту', -10, '10 BYN вернулись на карту') : this.setState({ note: 'Просьба снять деньги отправлена маме' })) },
        { label: 'Перевести', icon: 'M4 8h15l-4-4M20 16H5l4 4', go: () => this.setState({ note: teen ? 'Выбери: во вклад или другу по номеру телефона' : 'Переводы с копилки — с 14 лет' }) }
      ],
      hasNote: !!s.note,
      note: s.note,
      ops: s.ops.map((o) => ({
        ...o,
        sum: (o.amt < 0 ? '−' : '+') + Math.abs(o.amt).toFixed(2),
        sumStyle: 'font-size: 15px; font-weight: 700; white-space: nowrap; color: ' + (o.amt < 0 ? '#FFFFFF' : '#4CD47A'),
        arrow: o.amt < 0 ? 'M7 17L17 7M9 7h8v8' : 'M17 7L7 17M15 17H7V9'
      })),
      auto: s.auto,
      toggleAuto: () => this.setState({ auto: !s.auto }),
      autoTrack: 'width: 50px; height: 30px; border-radius: 15px; border: 0; padding: 3px; cursor: pointer; flex-shrink: 0; display: flex; justify-content: ' + (s.auto ? 'flex-end' : 'flex-start') + '; background: ' + (s.auto ? '#2B63F5' : '#3A3D4A'),
      settingLabel: teen ? 'Перевести во вклад' : 'Сменить цель',
      settingSub: teen ? '«МТБелки Online» — до 13,2% годовых' : 'Сейчас: велосипед за 450 BYN',
      settingHref: 'Deposits.dc.html',
      ages: [['kid', '7–13'], ['teen', '14–17']].map(([id, label]) => ({
        label,
        on: age === id,
        pick: () => this.setState({ age: id, note: '' }),
        s: 'height: 32px; padding: 0 10px; border-radius: 8px; border: 0; cursor: pointer; font: 600 13px Inter, sans-serif; color: ' + (age === id ? '#0B2C9C' : '#DCE5FF') + '; background: ' + (age === id ? '#FFFFFF' : 'transparent')
      }))
    };
  }
}
</script>
</body>
</html>

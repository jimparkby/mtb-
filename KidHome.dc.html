<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Приложение ребёнка 7–13</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#16171C}
a{color:#5B8CFF}a:hover{color:#8EB0FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #16171C; font-family: Inter, -apple-system, sans-serif; color: #FFFFFF; position: relative; overflow: hidden">
  <div style="background: linear-gradient(170deg, #2B63F5 0%, #0B2C9C 100%); border-radius: 0 0 30px 30px; padding: 52px 20px 20px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800">Т</div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 18px; font-weight: 700">Тимофей</div>
        <div style="font-size: 12px; color: #DCE5FF; margin-top: 1px">Moby Kids · •• 0427</div>
      </div>
      <a href="Game.dc.html" aria-label="MTcoin в игре" style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: rgba(22,23,28,.45); font-size: 14px; font-weight: 700; color: #FFD23F; white-space: nowrap; text-decoration: none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#FFD23F" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg>{{coins}} MTcoin</a>
    </div>
    <div style="font-size: 34px; font-weight: 700; margin-top: 16px; letter-spacing: -0.5px">{{balText}}</div>
    <div style="font-size: 13px; color: #DCE5FF; margin-top: 2px">Сегодня можно ещё 7,60 из 20 BYN</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px">
      <button type="button" onClick="{{actAsk}}" style="border: 0; cursor: pointer; background: rgba(22,23,28,.55); border-radius: 16px; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #FFFFFF; font: 13px Inter, sans-serif">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9FBBFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 11c0 5.6-7 10-7 10z"/></svg>Попросить</button>
      <a href="Kopilka.dc.html" style="background: rgba(22,23,28,.55); border-radius: 16px; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #FFFFFF; text-decoration: none; font-size: 13px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9FBBFF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 11c0-3 3-5 7-5s7 2 7 5v3l2 1v3h-3l-2 2H8l-1-2c-1.5-.8-2-2.2-2-4z"/><path d="M12 3v3"/></svg>В копилку</a>
      <button type="button" onClick="{{actPay}}" style="border: 0; cursor: pointer; background: rgba(22,23,28,.55); border-radius: 16px; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #FFFFFF; font: 13px Inter, sans-serif">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9FBBFF" stroke-width="1.8" aria-hidden="true"><path d="M4 7h14a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><path d="M4 7l11-3v3M16 13h1"/></svg>Оплатить</button>
    </div>
  </div>

  <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <a href="Game.dc.html" aria-label="Открыть игру Moby" style="display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 22px; background: linear-gradient(110deg, #1d3f99 0%, #2a1640 60%, #5a1260 100%); color: #FFFFFF; text-decoration: none">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #FFD23F">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V8l6-3v16M11 21V10l8 3v8M8 10v.01M8 13v.01M8 16v.01M15 15v.01M15 18v.01"/></svg>
      </div>
      <div style="flex: 1; min-width: 0"><div style="font-size: 17px; font-weight: 800; letter-spacing: 0.5px">MOBY</div><div style="font-size: 13px; color: #DCD3F5; margin-top: 2px">Квесты недели 2 из 5</div></div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </a>

    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px">
      <h2 style="margin: 0; font-size: 18px; font-weight: 700">Задания от мамы</h2>
      <a href="Game.dc.html" style="font-size: 14px; font-weight: 600; text-decoration: none">Все в игре</a>
    </div>
    <div style="background: #24262F; border-radius: 18px; padding: 2px 0">
      <sc-for list="{{tasks}}" as="t" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 0 12px 0 14px; border-bottom: 1px solid #2E3039">
          <div style="{{t.tile}}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"/></svg>
          </div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</div>
            <div style="font-size: 12px; color: #4CD47A; margin-top: 2px">{{t.reward}}</div>
          </div>
          <sc-if value="{{t.open}}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{t.submit}}" style="height: 36px; padding: 0 14px; border-radius: 11px; border: 0; background: #2B63F5; color: #FFFFFF; font: 600 14px Inter, sans-serif; cursor: pointer">Готово</button>
          </sc-if>
          <sc-if value="{{t.review}}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 12px; font-weight: 600; color: #FFC94D; background: #3A3016; padding: 6px 10px; border-radius: 10px; white-space: nowrap">На проверке</span>
          </sc-if>
          <sc-if value="{{t.paid}}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 12px; font-weight: 600; color: #4CD47A; background: #183526; padding: 6px 10px; border-radius: 10px">Оплачено</span>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <a href="Kopilka.dc.html" style="display: flex; align-items: center; gap: 12px; background: #24262F; border-radius: 18px; padding: 12px 14px; text-decoration: none; color: #FFFFFF">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #3ECF6E, #1D6B3A); flex-shrink: 0"></div>
      <div style="flex: 1; min-width: 0">
        <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 600">Копилка «Велосипед»</span><span style="font-size: 13px; color: #9A9CA8">86 из 450</span></div>
        <div style="height: 6px; border-radius: 3px; background: #2E3039; margin-top: 8px; overflow: hidden"><div style="width: 19%; height: 100%; background: #3ECF6E; border-radius: 3px"></div></div>
      </div>
    </a>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: #1E1F25; border-radius: 30px 30px 0 0; border-top: 1px solid #34363F; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 10px 8px 18px; box-sizing: border-box">
    <a href="KidHome.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #7FA2FF; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>Главная</a>
    <button type="button" onClick="{{menuProducts}}" style="border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #FFFFFF; font: 12px Inter, sans-serif">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="7" width="18" height="12" rx="2"/><path d="M5 4h15a2 2 0 012 2v9"/></svg>Продукты</button>
    <a href="Game.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #FFFFFF; font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFD23F" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V8l6-3v16M11 21V10l8 3v8"/></svg>Moby</a>
    <button type="button" onClick="{{openChat}}" style="border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #FFFFFF; font: 12px Inter, sans-serif">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 5h12v8H8l-3 3v-3H3zM15 9h6v8h-2v3l-3-3h-5v-4"/></svg>Чат</button>
    <button type="button" onClick="{{menuMore}}" style="border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #FFFFFF; font: 12px Inter, sans-serif">
      <svg width="24" height="24" viewBox="0 0 26 22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="5" cy="11" r="2.4"/><circle cx="13" cy="11" r="2.4"/><circle cx="21" cy="11" r="2.4"/></svg>Ещё</button>
  </nav>

  <sc-if value="{{ov.action}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 40"><dc-import name="Action" kind="{{ov.kind}}" who="kid" on-close="{{closeOv}}" on-done="{{onDone}}" hint-size="390px,844px"></dc-import></div>
  </sc-if>
  <sc-if value="{{ov.menu}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 40"><dc-import name="Menu" mode="{{ov.kind}}" who="kid" on-close="{{closeOv}}" hint-size="390px,844px"></dc-import></div>
  </sc-if>
  <sc-if value="{{ov.chat}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 40"><dc-import name="Chat" who="kid" on-close="{{closeOv}}" hint-size="390px,844px"></dc-import></div>
  </sc-if>
  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 16px; right: 16px; top: 50px; z-index: 50; background: #2E3039; border-radius: 14px; padding: 12px 16px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.45)">{{toast}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { st: { floor: 'review', vacuum: 'open', trash: 'paid' }, ov: null, toast: '', bal: 58.95, coins: 240 }; }
  componentWillUnmount() { clearTimeout(this.tt); }
  flash(msg) {
    this.setState({ toast: msg });
    clearTimeout(this.tt);
    this.tt = setTimeout(() => this.setState({ toast: '' }), 2600);
  }
  renderVals() {
    const s = this.state;
    const o = s.ov || {};
    const open = (type, kind) => () => this.setState({ ov: { type, kind } });
    // Как в репозитории mt-city (ui/child/Tasks.tsx): «Готово» → «На проверке» у мамы → «Оплачено»; награда в BYN и MTcoin
    const list = [
      { id: 'floor', name: 'Помыть пол', reward: '+4,00 BYN · +40 MTcoin', icon: 'M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z' },
      { id: 'vacuum', name: 'Пропылесосить в квартире', reward: '+3,00 BYN · +30 MTcoin', icon: 'M5 20h8M9 20V8a4 4 0 018 0v2M17 10l3 3-3 3' },
      { id: 'trash', name: 'Вынести мусор', reward: '+2,00 BYN · +20 MTcoin', icon: 'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13' }
    ];
    return {
      ov: { action: o.type === 'action', menu: o.type === 'menu', chat: o.type === 'chat', kind: o.kind || '' },
      closeOv: () => this.setState({ ov: null }),
      onDone: (delta, msg) => { this.setState({ bal: Math.round((this.state.bal + delta) * 100) / 100 }); this.flash(msg); },
      hasToast: !!s.toast,
      toast: s.toast,
      balText: s.bal.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' BYN',
      coins: s.coins,
      actAsk: open('action', 'ask'),
      actPay: open('action', 'pay'),
      menuProducts: open('menu', 'products'),
      menuMore: open('menu', 'more'),
      openChat: open('chat', ''),
      tasks: list.map((t) => {
        const st = s.st[t.id];
        return {
          ...t,
          open: st === 'open',
          review: st === 'review',
          paid: st === 'paid',
          submit: () => { this.setState({ st: { ...s.st, [t.id]: 'review' } }); this.flash('Отправлено маме на проверку'); },
          tile: 'width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #1E2A4A; color: ' + (st === 'paid' ? '#6C6F7C' : '#7FA2FF')
        };
      })
    };
  }
}
</script>
</body>
</html>

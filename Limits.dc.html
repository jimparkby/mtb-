<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Права ребёнка и согласия</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#16171C}
a{color:#5B8CFF}a:hover{color:#8EB0FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #16171C; font-family: Inter, -apple-system, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; padding: 52px 20px 34px; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="ChildData.dc.html" aria-label="Назад" style="width: 44px; height: 44px; display: flex; align-items: center; color: #2B63F5; margin-left: -8px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <span style="font-size: 15px; color: #9A9CA8">Шаг 3 из 4</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 4px">
    <div style="height: 4px; border-radius: 2px; background: #2B63F5"></div>
    <div style="height: 4px; border-radius: 2px; background: #2B63F5"></div>
    <div style="height: 4px; border-radius: 2px; background: #2B63F5"></div>
    <div style="height: 4px; border-radius: 2px; background: #2E3039"></div>
  </div>

  <h1 style="margin: 24px 0 6px; font-size: 26px; line-height: 1.2; font-weight: 700">Что можно Тимофею</h1>
  <p style="margin: 0 0 16px; font-size: 14px; line-height: 1.45; color: #9A9CA8">Изменить можно в любой момент в разделе «Семья»</p>

  <div style="background: #24262F; border-radius: 18px; padding: 4px 16px">
    <sc-for list="{{perms}}" as="p" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid #2E3039">
        <div style="flex: 1">
          <div style="font-size: 15px; font-weight: 500">{{p.title}}</div>
          <div style="font-size: 12px; color: #9A9CA8; margin-top: 2px">{{p.sub}}</div>
        </div>
        <button type="button" aria-label="{{p.title}}" onClick="{{p.toggle}}" style="{{p.track}}"><span style="{{p.knob}}"></span></button>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; background: #24262F; border-radius: 18px; padding: 14px 16px; margin-top: 10px">
    <div>
      <div style="font-size: 15px; font-weight: 500">Лимит трат в день</div>
      <div style="font-size: 12px; color: #9A9CA8; margin-top: 2px">Запрет 18+ и азартных игр — всегда</div>
    </div>
    <div style="font-size: 17px; font-weight: 700; color: #7FA2FF">20 BYN</div>
  </div>

  <label style="display: flex; gap: 12px; align-items: flex-start; margin-top: 16px; font-size: 13px; line-height: 1.45; color: #C8CAD3">
    <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #2B63F5; margin: 0; flex-shrink: 0">
    <span>Даю согласие как законный представитель на выпуск карты, доступ ребёнка в Moby и обработку его данных. <button type="button" onClick="{{openDoc}}" style="border: 0; background: none; padding: 0; color: #5B8CFF; font: inherit; cursor: pointer; text-decoration: underline">Документы</button></span>
  </label>

  <a href="CardDesign.dc.html" style="margin-top: auto; height: 54px; border-radius: 16px; background: #2B63F5; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Подтвердить</a>
  <sc-if value="{{docOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 40"><dc-import name="Menu" mode="doc" who="parent" doc-title="Согласие и договор" on-close="{{closeDoc}}" hint-size="390px,844px"></dc-import></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { on: { online: true, p2p: false, deposit: true, cash: true, confirm: false } }; }
  renderVals() {
    const list = [
      { id: 'online', title: 'Покупки в интернете', sub: 'Только проверенные магазины' },
      { id: 'p2p', title: 'Переводы друзьям', sub: 'По номеру телефона' },
      { id: 'deposit', title: 'Открывать копилки', sub: 'Цели и накопления' },
      { id: 'cash', title: 'Снятие наличных', sub: 'До 10 BYN в день' },
      { id: 'confirm', title: 'Покупки от 30 BYN — с моим ОК', sub: 'Push-запрос на подтверждение' }
    ];
    return {
      docOpen: !!this.state.doc,
      openDoc: () => this.setState({ doc: true }),
      closeDoc: () => this.setState({ doc: false }),
      perms: list.map((p) => {
        const v = this.state.on[p.id];
        return {
          ...p,
          toggle: () => this.setState({ on: { ...this.state.on, [p.id]: !v } }),
          track: 'width: 50px; height: 30px; border-radius: 15px; border: 0; padding: 3px; cursor: pointer; flex-shrink: 0; display: flex; justify-content: ' + (v ? 'flex-end' : 'flex-start') + '; background: ' + (v ? '#2B63F5' : '#3A3D4A'),
          knob: 'width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; display: block'
        };
      })
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>История — Семья в Moby</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B2C9C}
a{color:#FFFFFF}a:hover{color:#DCE5FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #2B63F5 0%, #0B2C9C 55%, #16171C 100%); font-family: Inter, -apple-system, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; padding: 50px 20px 34px; position: relative">
  <div style="display: flex; gap: 4px">
    <sc-for list="{{bars}}" as="b" hint-placeholder-count="4">
      <button type="button" aria-label="{{b.label}}" onClick="{{b.go}}" style="{{b.s}}"></button>
    </sc-for>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 12px">
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="width: 32px; height: 32px; border-radius: 10px; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px">М</div>
      <span style="font-size: 14px; font-weight: 600">Moby</span>
    </div>
    <a href="Home.dc.html" aria-label="Закрыть" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-end">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px">
    <div style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #9FBBFF">{{kicker}}</div>
    <h1 style="margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -0.6px">{{title}}</h1>
    <p style="margin: 0; font-size: 17px; line-height: 1.5; color: #DCE5FF">{{text}}</p>
  </div>

  <button type="button" aria-label="Назад" onClick="{{prev}}" style="position: absolute; left: 0; top: 140px; bottom: 140px; width: 35%; background: transparent; border: 0; cursor: pointer"></button>
  <button type="button" aria-label="Дальше" onClick="{{next}}" style="position: absolute; right: 0; top: 140px; bottom: 140px; width: 65%; background: transparent; border: 0; cursor: pointer"></button>

  <a href="Main.dc.html" style="height: 54px; border-radius: 16px; background: #FFFFFF; color: #0B2C9C; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none; position: relative">Оформить пакет</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { i: 0 }; }
  renderVals() {
    const slides = [
      { kicker: 'Семья в Moby', title: 'Первая карта — для ребёнка, контроль — у вас', text: 'Оформите детскую карту за 3 минуты прямо в приложении. Выпуск и обслуживание бесплатны.' },
      { kicker: 'Карманные деньги', title: 'Автоперевод каждую неделю', text: 'Выберите сумму и день — деньги придут сами. Ребёнок учится планировать бюджет.' },
      { kicker: 'Копилка', title: 'Цель на велосипед? Копим вместе', text: 'Ребёнок откладывает с покупок, вы добавляете бонус за выполненные задания.' },
      { kicker: 'Безопасность', title: '18+ и азартные игры — под запретом', text: 'Видите каждую покупку, ставите лимиты и блокируете карту в один тап.' }
    ];
    const i = this.state.i;
    const s = slides[i];
    return {
      ...s,
      prev: () => this.setState({ i: Math.max(0, i - 1) }),
      next: () => this.setState({ i: Math.min(slides.length - 1, i + 1) }),
      bars: slides.map((x, k) => ({
        label: 'Слайд ' + (k + 1),
        go: () => this.setState({ i: k }),
        s: 'flex: 1; height: 4px; border: 0; padding: 0; border-radius: 2px; cursor: pointer; background: ' + (k <= i ? '#FFFFFF' : 'rgba(255,255,255,.3)')
      }))
    };
  }
}
</script>
</body>
</html>

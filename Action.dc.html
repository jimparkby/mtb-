<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Шторка действия</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Inter, -apple-system, sans-serif; color: #FFFFFF">
  <button type="button" aria-label="Закрыть" onClick="{{close}}" style="position: absolute; inset: 0; border: 0; padding: 0; background: rgba(0,0,0,.6); cursor: pointer"></button>
  <div role="dialog" aria-label="{{title}}" style="position: absolute; left: 0; right: 0; bottom: 0; background: #1E1F25; border-radius: 28px 28px 0 0; padding: 10px 20px 30px; display: flex; flex-direction: column; gap: 14px">
    <div style="width: 40px; height: 5px; border-radius: 3px; background: #3A3D4A; align-self: center"></div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 20px; font-weight: 800">{{title}}</span>
      <button type="button" aria-label="Закрыть" onClick="{{close}}" style="width: 40px; height: 40px; border-radius: 12px; border: 0; background: #2E3039; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <sc-if value="{{isForm}}" hint-placeholder-val="{{ true }}">
      <sc-if value="{{hasNote}}" hint-placeholder-val="{{ false }}">
        <div style="font-size: 14px; line-height: 1.45; color: #C8CAD3">{{note}}</div>
      </sc-if>
      <sc-if value="{{hasOptions}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 13px; color: #9A9CA8">{{optLabel}}</span>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
              <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="{{o.s}}">{{o.label}}</button>
            </sc-for>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{hasAmount}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; align-items: center; justify-content: space-between; background: #24262F; border-radius: 18px; padding: 12px 14px">
          <button type="button" aria-label="Меньше" onClick="{{minus}}" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #2E3039; color: #FFFFFF; font: 700 22px Inter, sans-serif; cursor: pointer">−</button>
          <span style="font-size: 30px; font-weight: 800">{{amtText}} <span style="font-size: 16px; color: #9A9CA8">BYN</span></span>
          <button type="button" aria-label="Больше" onClick="{{plus}}" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #2E3039; color: #FFFFFF; font: 700 22px Inter, sans-serif; cursor: pointer">+</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
            <button type="button" onClick="{{c.pick}}" style="{{c.s}}">{{c.label}}</button>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{hasWarn}}" hint-placeholder-val="{{ false }}">
        <div style="font-size: 13px; color: #FFC94D; background: #3A3016; border-radius: 12px; padding: 10px 12px">{{warn}}</div>
      </sc-if>
      <div style="display: flex; gap: 8px">
        <sc-if value="{{hasSecondary}}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{secondary}}" style="flex: 1; height: 54px; border-radius: 16px; border: 0; background: #2E3039; color: #FFFFFF; font: 600 16px Inter, sans-serif; cursor: pointer">{{secondaryLabel}}</button>
        </sc-if>
        <button type="button" onClick="{{confirm}}" style="flex: 2; height: 54px; border-radius: 16px; border: 0; background: #2B63F5; color: #FFFFFF; font: 600 16px Inter, sans-serif; cursor: pointer">{{cta}}</button>
      </div>
    </sc-if>

    <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 0 4px; text-align: center">
        <div style="width: 72px; height: 72px; border-radius: 50%; background: #2B63F5; display: flex; align-items: center; justify-content: center">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </div>
        <div style="font-size: 20px; font-weight: 800">{{doneTitle}}</div>
        <div style="font-size: 14px; line-height: 1.45; color: #C8CAD3; max-width: 300px">{{doneText}}</div>
      </div>
      <button type="button" onClick="{{close}}" style="height: 54px; border-radius: 16px; border: 0; background: #2B63F5; color: #FFFFFF; font: 600 16px Inter, sans-serif; cursor: pointer">Готово</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["topup","transfer","pay","ask","reply","child","deposit","goal"],"default":"transfer"},"who":{"editor":"enum","options":["parent","kid","teen"],"default":"parent"},"onClose":{"editor":null},"onDone":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { opt: 0, amt: null, done: false }; }
  renderVals() {
    const kind = this.props.kind ?? 'transfer';
    const who = this.props.who ?? 'parent';
    const s = this.state;
    const money = (v) => v.toFixed(2).replace('.', ',');
    // Описание каждой шторки: заголовок, варианты, сумма по умолчанию, кнопка и итог
    const K = {
      topup: { title: 'Пополнить карту', optLabel: 'Откуда', options: ['С карты другого банка', 'Наличными в банкомате', 'По ЕРИП'], amt: 50, cta: 'Пополнить', doneTitle: 'Карта пополнена', sign: 1 },
      transfer: who === 'teen'
        ? { title: 'Перевести', optLabel: 'Кому', options: ['Другу по номеру', 'В копилку', 'Маме'], amt: 5, cta: 'Перевести', doneTitle: 'Перевод отправлен', sign: -1 }
        : { title: 'Перевести', optLabel: 'Кому', options: ['Тимофею · Moby Kids', 'Марку · Moby Teen', 'По номеру телефона'], amt: 10, cta: 'Перевести', doneTitle: 'Перевод отправлен', sign: -1 },
      pay: who === 'parent'
        ? { title: 'Оплатить', optLabel: 'Что оплачиваем', options: ['Мобильная связь', 'Интернет', 'Коммунальные', 'По QR'], amt: 20, cta: 'Оплатить', doneTitle: 'Оплачено', sign: -1 }
        : { title: 'Оплатить', optLabel: 'Где платишь', options: ['По QR на кассе', 'Проезд', 'Онлайн-магазин'], amt: 5, cta: 'Оплатить', doneTitle: 'Оплачено', sign: -1 },
      ask: { title: 'Попросить у мамы', optLabel: 'На что', options: ['Кино', 'Еда', 'Подарок другу', 'Другое'], amt: 10, cta: 'Отправить просьбу', doneTitle: 'Просьба отправлена', sign: 0 },
      reply: { title: 'Просьба Тимофея', note: 'Тимофей просит 15 BYN на «Кино с друзьями». Деньги придут на карту Moby Kids сразу.', amt: 15, cta: 'Перевести', secondary: 'Отказать', doneTitle: 'Переведено Тимофею', sign: -1 },
      child: { title: 'Пополнить карту Тимофея', optLabel: 'Как', options: ['Разово', 'Сделать карманными'], amt: 10, cta: 'Пополнить', doneTitle: 'Деньги у Тимофея', sign: -1 },
      deposit: { title: 'Открыть вклад', optLabel: 'Срок и ставка', options: ['3 мес · 3%', '6 мес · 4%', '12 мес · до 13,2%'], amt: 100, cta: 'Открыть вклад', doneTitle: 'Вклад открыт', sign: -1 },
      goal: { title: 'Новая цель', optLabel: 'На что копим', options: ['Телефон', 'Лагерь', 'Наушники', 'Своё'], amt: 200, cta: 'Создать цель', doneTitle: 'Цель создана', sign: 0 }
    }[kind];
    const amt = s.amt ?? K.amt;
    const optName = K.options ? K.options[s.opt] : '';
    // Правило из репозитория: у 7–13 покупки дороже 10 BYN подтверждает мама, у 14–17 — дороже 30 BYN
    const limit = who === 'kid' ? 10 : who === 'teen' ? 30 : Infinity;
    const needOk = kind === 'pay' && amt > limit;
    const doneText = {
      topup: money(amt) + ' BYN · ' + optName,
      transfer: money(amt) + ' BYN · ' + optName,
      pay: needOk ? 'Покупка дороже ' + limit + ' BYN — мама получила запрос на подтверждение' : money(amt) + ' BYN · ' + optName,
      ask: 'Мама получила пуш: ' + money(amt) + ' BYN на «' + optName + '»',
      reply: 'Тимофей получил ' + money(amt) + ' BYN и уведомление',
      child: money(amt) + ' BYN · ' + (s.opt ? 'каждую неделю по понедельникам' : 'разовый перевод'),
      deposit: money(amt) + ' BYN · ' + optName,
      goal: '«' + optName + '» на ' + money(amt) + ' BYN — появится в копилке'
    }[kind];
    const finish = (delta, msg) => {
      this.setState({ done: true });
      if (this.props.onDone) this.props.onDone(delta, msg);
    };
    const step = amt >= 50 ? 5 : 1;
    return {
      title: K.title,
      isForm: !s.done, isDone: s.done,
      hasNote: !!K.note, note: K.note || '',
      hasOptions: !!K.options, optLabel: K.optLabel || '',
      options: (K.options || []).map((label, i) => ({
        label, on: s.opt === i, pick: () => this.setState({ opt: i }),
        s: 'height: 40px; padding: 0 14px; border-radius: 12px; cursor: pointer; font: 600 14px Inter, sans-serif; color: #FFFFFF; background: ' + (s.opt === i ? '#1E2A4A' : '#24262F') + '; border: 1.5px solid ' + (s.opt === i ? '#2B63F5' : 'transparent')
      })),
      hasAmount: true,
      amtText: money(amt),
      minus: () => this.setState({ amt: Math.max(1, amt - step) }),
      plus: () => this.setState({ amt: Math.min(2000, amt + step) }),
      chips: (K.amt >= 50 ? [50, 100, 200, 500] : [5, 10, 15, 25]).map((v) => ({
        label: v + ' BYN', pick: () => this.setState({ amt: v }),
        s: 'height: 40px; border-radius: 12px; border: 0; cursor: pointer; font: 600 14px Inter, sans-serif; color: #FFFFFF; background: ' + (amt === v ? '#2B63F5' : '#2E3039')
      })),
      hasWarn: needOk,
      warn: 'Больше ' + limit + ' BYN — покупку подтвердит мама',
      hasSecondary: !!K.secondary, secondaryLabel: K.secondary || '',
      secondary: () => { this.setState({ done: true }); if (this.props.onDone) this.props.onDone(0, 'Просьба отклонена'); },
      cta: K.cta + (K.sign === -1 || kind === 'topup' ? ' · ' + money(amt) + ' BYN' : ''),
      confirm: () => finish(needOk ? 0 : K.sign * amt, K.doneTitle + ' · ' + money(amt) + ' BYN'),
      doneTitle: needOk ? 'Ждём маму' : K.doneTitle,
      doneText,
      close: () => { if (this.props.onClose) this.props.onClose(); }
    };
  }
}
</script>
</body>
</html>

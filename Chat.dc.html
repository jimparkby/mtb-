<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Чат с Moby</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#16171C}
input::placeholder{color:#6C6F7C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #16171C; font-family: Inter, -apple-system, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; padding: 48px 0 26px">
  <div style="display: flex; align-items: center; gap: 8px; padding: 0 16px 10px">
    <button type="button" aria-label="Назад" onClick="{{close}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #2B63F5; cursor: pointer; display: flex; align-items: center; margin-left: -8px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div style="width: 36px; height: 36px; border-radius: 12px; background: linear-gradient(135deg, #2B63F5, #0B2C9C); display: flex; align-items: center; justify-content: center; font-weight: 800">M</div>
    <div style="flex: 1"><div style="font-size: 16px; font-weight: 700">Чат с Moby</div><div style="font-size: 12px; color: #4CD47A">онлайн · ответим за минуту</div></div>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="2">
      <div style="{{m.s}}">{{m.text}}</div>
    </sc-for>
  </div>

  <div style="display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto">
    <sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
      <button type="button" onClick="{{q.send}}" style="flex-shrink: 0; height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #2B63F5; background: transparent; color: #7FA2FF; font: 600 13px Inter, sans-serif; cursor: pointer; white-space: nowrap">{{q.label}}</button>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; padding: 6px 16px 0">
    <input type="text" aria-label="Новое сообщение" placeholder="Новое сообщение" value="{{draft}}" onChange="{{onInput}}" onKeyDown="{{onKey}}" style="flex: 1; height: 48px; border-radius: 24px; border: 0; background: #24262F; color: #FFFFFF; font: 500 15px Inter, sans-serif; padding: 0 18px; outline: none">
    <button type="button" aria-label="Отправить" onClick="{{sendDraft}}" style="{{sendS}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"who":{"editor":"enum","options":["parent","kid","teen"],"default":"parent"},"onClose":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { draft: '', msgs: [{ me: false, text: 'Здравствуйте! Я помощник Moby. Спросите про карту, лимиты, копилку или задания.' }] };
  }
  componentWillUnmount() { clearTimeout(this.t); }
  answer(q) {
    const t = q.toLowerCase();
    if (t.includes('лимит')) return 'Лимиты ставит родитель: у 7–13 лет — 20 BYN в день, у 14–17 — 50 BYN. Изменить можно в «Кабинете семьи» → «Контроль».';
    if (t.includes('потер') || t.includes('заблок')) return 'Карту можно заблокировать в Moby одной кнопкой — деньги останутся на счёте. Новая цифровая карта появится сразу.';
    if (t.includes('копил')) return 'Копилка приносит 8% годовых. Пополнять можно с карты, а с 14 лет — и снимать самому.';
    if (t.includes('задан') || t.includes('оцен')) return 'Задания и награды за оценки родитель настраивает в «Кабинете семьи». Деньги приходят после проверки.';
    if (t.includes('кешб')) return 'Кешбэк у Moby Teen растёт с тратами: 1% от 50 BYN в месяц, 2% от 100, 3% от 200.';
    return 'Спасибо! Передал вопрос специалисту — ответим здесь в течение пары минут.';
  }
  renderVals() {
    const s = this.state;
    const send = (text) => {
      const v = (text || '').trim();
      if (!v) return;
      this.setState({ draft: '', msgs: [...s.msgs, { me: true, text: v }] });
      clearTimeout(this.t);
      this.t = setTimeout(() => this.setState({ msgs: [...this.state.msgs, { me: false, text: this.answer(v) }] }), 700);
    };
    const who = this.props.who ?? 'parent';
    const Q = who === 'parent' ? ['Как поменять лимит?', 'Задания и оценки', 'Потеряна карта'] : who === 'teen' ? ['Как растёт кешбэк?', 'Копилка', 'Потерял карту'] : ['Что такое копилка?', 'Мои задания', 'Потерял карту'];
    return {
      msgs: s.msgs.map((m) => ({ ...m, s: 'max-width: 78%; padding: 10px 14px; font-size: 15px; line-height: 1.4; border-radius: 18px; ' + (m.me ? 'align-self: flex-end; background: #2B63F5; border-bottom-right-radius: 6px' : 'align-self: flex-start; background: #24262F; border-bottom-left-radius: 6px') })),
      quick: Q.map((label) => ({ label, send: () => send(label) })),
      draft: s.draft,
      onInput: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') send(s.draft); },
      sendDraft: () => send(s.draft),
      sendS: 'width: 48px; height: 48px; border-radius: 50%; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #FFFFFF; background: ' + (s.draft.trim() ? '#2B63F5' : '#2E3039'),
      close: () => { if (this.props.onClose) this.props.onClose(); }
    };
  }
}
</script>
</body>
</html>

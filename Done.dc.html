<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пакет оформлен</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#16171C}
a{color:#5B8CFF}a:hover{color:#8EB0FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #16171C; font-family: Inter, -apple-system, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; padding: 96px 20px 34px; text-align: center">
  <div style="width: 96px; height: 96px; border-radius: 50%; background: #1E2A4A; display: flex; align-items: center; justify-content: center">
    <div style="width: 64px; height: 64px; border-radius: 50%; background: #2B63F5; display: flex; align-items: center; justify-content: center">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
  </div>
  <h1 style="margin: 24px 0 8px; font-size: 26px; line-height: 1.2; font-weight: 700">Готово! Карта выпущена</h1>
  <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #9A9CA8; max-width: 300px">Цифровая карта уже в Moby — ребёнок может платить телефоном и онлайн</p>

  <div style="width: 100%; background: #24262F; border-radius: 20px; padding: 20px; box-sizing: border-box; margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 12px">
    <div style="font-size: 15px; font-weight: 600">Пригласите Тимофея в Moby</div>
    <div style="width: 148px; height: 148px; border-radius: 12px; background: #FFFFFF; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 12px; box-sizing: border-box">
      <sc-for list="{{qr}}" as="c" hint-placeholder-count="49">
        <div style="{{c.s}}"></div>
      </sc-for>
    </div>
    <div style="font-size: 13px; color: #9A9CA8; line-height: 1.45">Отсканируйте с телефона ребёнка<br>или отправьте ссылку. Код действует 24 часа</div>
  </div>

  <div style="width: 100%; margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button type="button" onClick="{{sendLink}}" style="{{sendS}}">{{sendLabel}}</button>
    <a href="Home.dc.html" style="height: 54px; border-radius: 16px; background: #24262F; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">На главную</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const bits = '1110111101010111100111010110001101110101101111011';
    const sent = !!this.state && !!this.state.sent;
    return { sendLabel: sent ? 'Ссылка отправлена Тимофею ✓' : 'Отправить ссылку ребёнку', sendLink: () => this.setState({ sent: true }), sendS: 'height: 54px; border-radius: 16px; border: 0; cursor: pointer; color: #FFFFFF; font: 600 16px Inter, sans-serif; background: ' + (sent ? '#1F7A45' : '#2B63F5'), qr: bits.split('').map((b) => ({ s: 'border-radius: 2px; background: ' + (b === '1' ? '#16171C' : 'transparent') })) };
  }
}
</script>
</body>
</html>
